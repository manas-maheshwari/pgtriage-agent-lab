name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check:all

      - name: Run tests
        run: npm test

      - name: Run local Cloudflare tests
        run: npm run test:cloudflare

      - name: Install browser for local tests
        run: npx playwright install --with-deps chromium

      - name: Run local browser tests
        run: npm run test:browser

      - name: Run evaluation suite
        run: npm run eval

      - name: Smoke-test MCP fixture
        run: npm run demo:mcp:concise
